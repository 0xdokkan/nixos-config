# ╔══════════════════════════════════════════════════════════════════════╗
# ║  mango — regole per finestre e layer (portate dalle window-rule      ║
# ║  di niri, che a loro volta venivano da HyDE)                         ║
# ║                                                                      ║
# ║  windowrule=PARAMETRO:valore,...,appid:REGEX,title:REGEX             ║
# ║  Le regex sono PCRE e cercano ovunque nel testo: per un nome esatto  ║
# ║  servono ^ e $. Niente virgole nelle regex (separano i campi).       ║
# ║  appid e titolo di una finestra: `mmsg get clients`.                 ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ━━━━ OPACITÀ PER APP (il blur dietro è globale, in config.conf) ━━━━━━━━
windowrule=focused_opacity:0.90,unfocused_opacity:0.90,appid:^(firefox|librewolf)$
windowrule=focused_opacity:0.80,unfocused_opacity:0.80,appid:^kitty$
windowrule=focused_opacity:0.80,unfocused_opacity:0.80,appid:^org\.gnome\.Nautilus$
windowrule=focused_opacity:0.75,unfocused_opacity:0.75,appid:^org\.freedesktop\.impl\.portal\.desktop\.gtk$
windowrule=focused_opacity:0.70,unfocused_opacity:0.70,appid:^([Ss]team|steamwebhelper|[Ss]potify)$
windowrule=focused_opacity:0.80,unfocused_opacity:0.80,appid:^(com\.github\.tchx84\.Flatseal|hu\.kramo\.Cartridges|com\.obsproject\.Studio|gnome-boxes)$
windowrule=focused_opacity:0.80,unfocused_opacity:0.80,appid:^(vesktop|discord|WebCord|ArmCord)$
windowrule=focused_opacity:0.80,unfocused_opacity:0.80,appid:^(com\.github\.unrud\.VideoDownloader|io\.github\.flattool\.Warehouse)$


# ━━━━ FLOTTANTI (con la loro opacità) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule=isfloating:1,focused_opacity:0.80,unfocused_opacity:0.80,appid:^(org\.kde\.ark|qt5ct|qt6ct)$
windowrule=isfloating:1,focused_opacity:0.75,unfocused_opacity:0.75,appid:^(org\.pulseaudio\.pavucontrol|nm-connection-editor)$
windowrule=isfloating:1,focused_opacity:0.90,unfocused_opacity:0.90,appid:^com\.github\.rafostar\.Clapper$
windowrule=isfloating:1,focused_opacity:0.80,unfocused_opacity:0.80,appid:^(app\.drey\.Warp|net\.davidotek\.pupgui2|yad|Signal)$
windowrule=isfloating:1,focused_opacity:0.80,unfocused_opacity:0.80,appid:^(io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler)$
windowrule=isfloating:1,focused_opacity:0.80,unfocused_opacity:0.80,appid:^(io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter)$
windowrule=isfloating:1,appid:^(vlc|eog|xdg-desktop-portal-gtk)$

# Monitor di sistema aperti in kitty (Ctrl+Shift+Esc)
windowrule=isfloating:1,width:0.6,height:0.7,appid:^kitty$,title:^(top|btop|htop)$

# Finestrelle di Firefox
windowrule=isfloating:1,title:^About Mozilla Firefox$
windowrule=isfloating:1,appid:^(firefox|librewolf)$,title:^(Picture-in-Picture|Library)$

# Dialoghi di file
windowrule=isfloating:1,title:^(Open|Choose Files|Save As|Confirm to replace files|File Operation Progress)$


# ━━━━ PRIVACY NEGLI SCREENCAST ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Il QR del Wi-Fi (voce "Wi-Fi QR" nel launcher) mostra la password
# della rete: nelle registrazioni e nelle condivisioni dello schermo
# resta un rettangolo nero.
windowrule=isfloating:1,shield_when_capture:1,isnoanimation:1,appid:^wifi-qr$


# ━━━━ LAYER (barra, launcher, notifiche, OSD) ━━━━━━━━━━━━━━━━━━━━━━━━━━
# rofi e swaync hanno il blur dietro (blur_layer in config.conf).
layerrule=animation_type_open:zoom,animation_type_close:fade,layer_name:^rofi$
# La barra è una striscia trasparente con dei riquadri sopra: il blur
# coprirebbe anche lo spazio vuoto tra un riquadro e l'altro.
layerrule=noblur:1,noshadow:1,layer_name:^waybar$
# La selezione di slurp (screenshot): né animazione né blur, altrimenti
# finiscono nell'immagine.
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:^selection$
# Notifiche: entrano e escono senza zoom.
layerrule=animation_type_open:slide,animation_type_close:fade,layer_name:^swaync
