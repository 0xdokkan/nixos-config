# ╔══════════════════════════════════════════════════════════════════════╗
# ║  mango — regole per finestre e layer (portate dalle window-rule      ║
# ║  di niri, che a loro volta venivano da HyDE)                         ║
# ║                                                                      ║
# ║  window_rule=PARAMETRO:valore,...,app_id:REGEX,title:REGEX           ║
# ║  Le regex sono PCRE e cercano ovunque nel testo: per un nome esatto  ║
# ║  servono ^ e $. Niente virgole nelle regex (separano i campi).       ║
# ║  app_id e titolo di una finestra: `mmsg get clients`.                ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ━━━━ OPACITÀ PER APP (il blur dietro è globale, in config.conf) ━━━━━━━━
window_rule=focused_opacity:0.90,unfocused_opacity:0.90,app_id:^(firefox|librewolf)$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^kitty$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^org\.gnome\.Nautilus$
window_rule=focused_opacity:0.75,unfocused_opacity:0.75,app_id:^org\.freedesktop\.impl\.portal\.desktop\.gtk$
window_rule=focused_opacity:0.70,unfocused_opacity:0.70,app_id:^([Ss]team|steamwebhelper|[Ss]potify)$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(com\.github\.tchx84\.Flatseal|hu\.kramo\.Cartridges|com\.obsproject\.Studio|gnome-boxes)$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(vesktop|discord|WebCord|ArmCord)$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(com\.github\.unrud\.VideoDownloader|io\.github\.flattool\.Warehouse)$


# ━━━━ FLOTTANTI (con la loro opacità) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
window_rule=is_floating:1,focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(org\.kde\.ark|qt5ct|qt6ct)$
window_rule=is_floating:1,focused_opacity:0.75,unfocused_opacity:0.75,app_id:^(org\.pulseaudio\.pavucontrol|nm-connection-editor)$
window_rule=is_floating:1,focused_opacity:0.90,unfocused_opacity:0.90,app_id:^com\.github\.rafostar\.Clapper$
window_rule=is_floating:1,focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(app\.drey\.Warp|net\.davidotek\.pupgui2|yad|Signal)$
window_rule=is_floating:1,focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler)$
window_rule=is_floating:1,focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter)$
window_rule=is_floating:1,app_id:^(vlc|eog|xdg-desktop-portal-gtk)$

# Monitor di sistema aperti in kitty (Ctrl+Shift+Esc)
window_rule=is_floating:1,width:0.6,height:0.7,app_id:^kitty$,title:^(top|btop|htop)$

# Finestrelle di Firefox
window_rule=is_floating:1,title:^About Mozilla Firefox$
window_rule=is_floating:1,app_id:^(firefox|librewolf)$,title:^(Picture-in-Picture|Library)$

# Dialoghi di file
window_rule=is_floating:1,title:^(Open|Choose Files|Save As|Confirm to replace files|File Operation Progress)$


# ━━━━ PRIVACY NEGLI SCREENCAST ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Il QR del Wi-Fi (voce "Wi-Fi QR" nel launcher) mostra la password
# della rete: nelle registrazioni e nelle condivisioni dello schermo
# resta un rettangolo nero.
window_rule=is_floating:1,shield_when_capture:1,no_animation:1,app_id:^wifi-qr$


# ━━━━ LAYER (barra, launcher, notifiche, OSD) ━━━━━━━━━━━━━━━━━━━━━━━━━━
# rofi e swaync hanno il blur dietro (blur_layer in config.conf).
layer_rule=animation_type_open:zoom,animation_type_close:fade,layer_name:^rofi$
# La barra è una striscia trasparente con dei riquadri sopra: il blur
# coprirebbe anche lo spazio vuoto tra un riquadro e l'altro.
layer_rule=no_blur:1,no_shadow:1,layer_name:^waybar$
# La selezione di slurp (screenshot): né animazione né blur, altrimenti
# finiscono nell'immagine.
layer_rule=no_animation:1,no_blur:1,no_shadow:1,layer_name:^selection$
# Notifiche: entrano e escono senza zoom.
layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:^swaync
