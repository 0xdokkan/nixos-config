# ╔══════════════════════════════════════════════════════════════════════╗
# ║  mango — MODALITÀ GIOCO (Mod+Alt+G → gamemode.sh)                    ║
# ║                                                                      ║
# ║  Include la config normale e cambia solo ciò che serve per giocare:  ║
# ║  niente gap, animazioni, blur e ombre. Lo script la carica con       ║
# ║  `mmsg dispatch load_config_file` e al secondo Mod+Alt+G torna a     ║
# ║  config.conf. Validata a build-time insieme alle altre.              ║
# ╚══════════════════════════════════════════════════════════════════════╝

source=./config.conf

gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
animations=0
layer_animations=0
blur=0
shadows=0
