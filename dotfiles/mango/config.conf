# ╔══════════════════════════════════════════════════════════════════════╗
# ║  mango — config principale (portata da niri, ottobre 2026)           ║
# ║                                                                      ║
# ║  File nella stessa cartella, inclusi qui sotto:                      ║
# ║    theme.conf  colori Tokyo Night Storm e cursore (GENERATO da       ║
# ║                home/mango-configs.nix a partire da home/palette.nix) ║
# ║    host.conf   layout tastiera dell'host (GENERATO)                  ║
# ║    rules.conf  regole per finestre e layer                           ║
# ║    binds.conf  scorciatoie (Mod+Shift+/ le mostra tutte)             ║
# ║    gaming.conf include questa e toglie gap e animazioni (Mod+Alt+G)  ║
# ║                                                                      ║
# ║  Validata a build-time con `mango -p`: se c'è un errore o un         ║
# ║  avviso il sistema non si builda. Ricarica a caldo: Mod+Shift+C.     ║
# ║  Opzioni e default: /etc/mango/config.conf e la doc di mango.        ║
# ╚══════════════════════════════════════════════════════════════════════╝

source=./theme.conf
source=./host.conf
source=./rules.conf
source=./binds.conf


# ━━━━ AVVIO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# mango esporta da solo WAYLAND_DISPLAY & co. verso systemd e dbus, ma in
# modo asincrono e senza avviare nessun target. Qui l'ambiente si importa
# in modo sincrono e poi parte mango-session.target (home/mango.nix), che
# tira su graphical-session.target: waybar, swaync, swayidle e gli altri
# servizi utente partono da lì, una volta sola.
# exec-once gira solo all'avvio, non a ogni reload.
exec-once=mango-session-start


# ━━━━ INPUT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Il layout (xkb_rules_layout) sta in host.conf.
numlockon=1
repeat_delay=600
repeat_rate=25

# Touchpad stile mac, come in niri: tap, niente touchpad mentre scrivi,
# scroll naturale, click con due/tre dita (clickfinger).
tap_to_click=1
trackpad_disable_while_typing=1
trackpad_natural_scrolling=1
trackpad_click_method=2
trackpad_accel_profile=2
trackpad_accel_speed=0.0

# Mouse senza accelerazione
mouse_accel_profile=1
mouse_accel_speed=0.0


# ━━━━ FOCUS E TAG ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 10 tag: Mod+1..9 e Mod+0 per il decimo.
tag_num=10
# Ripremere il tag corrente torna al precedente
# (era workspace-auto-back-and-forth in niri).
view_current_to_back=1
# In niri il focus non seguiva il mouse e il cursore non saltava.
sloppyfocus=0
warpcursor=0
focus_on_activate=1


# ━━━━ LAYOUT: scroller su tutti i tag ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
tagrule=id:*,layout_name:scroller

# Mod+R cicla queste larghezze; le nuove finestre nascono a metà.
scroller_proportion_preset=0.33333,0.5,0.66667,1.0
scroller_default_proportion=0.5
# Da sola in un tag la finestra prende tutta la larghezza. Appena ne
# arriva un'altra tornano le larghezze normali e si ridimensiona con
# Mod+R / Mod+Shift+frecce. (Con =1 anche da sola si potrebbe
# ridimensionare, ma nascerebbe a metà, centrata.)
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
# Come center-focused-column "never": la finestra a fuoco si sposta il
# minimo indispensabile, senza essere centrata o allargata.
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0
scroller_structs=20

# Gap di 8 px come in niri, dentro e fuori.
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0


# ━━━━ OVERVIEW (Mod+S) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# A carosello: tutte le finestre di tutti i tag in una fila, quella a
# fuoco grande al centro e le altre sempre più piccole ai lati.
# ov_carousel viene dalla nostra patch (patches/, flake.nix → mangoOverlay).
#   Mod+S o swipe a 4 dita    apre; ripremuto chiude sulla finestra al centro
#   ←/→ (anche con Mod) o swipe a 3 dita    gira il carosello
#   Invio, Esc o click sinistro    vai alla finestra (click destro la chiude)
# ov_tab_mode=0: con 1 Mod+S girerebbe invece di chiudere e rilasciare Mod
# sceglierebbe, come un alt-tab; lo swipe in giù non chiuderebbe più.
ov_carousel=1
ov_tab_mode=0
# Margine dai bordi dello schermo e spazio tra le finestre.
overviewgappo=60
overviewgappi=32


# ━━━━ ASPETTO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Colori dei bordi: theme.conf. Bordo da 2 px come il focus-ring di niri.
borderpx=2
border_radius=8
no_border_when_single=0

# Blur dietro le finestre trasparenti (kitty, Nautilus, Firefox...) e
# dietro rofi/swaync. blur_optimized riusa il blur dello sfondo: sulla
# HD 620 del portatile è quello che lo rende sostenibile.
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=5
blur_params_num_passes=3

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=12
shadows_blur=15

# Le opacità per app stanno in rules.conf.
focused_opacity=1.0
unfocused_opacity=1.0


# ━━━━ ANIMAZIONI (stesse durate e curve di niri) ━━━━━━━━━━━━━━━━━━━━━━━
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
zoom_initial_ratio=0.85
zoom_end_ratio=0.85
# Tag in verticale, come i workspace di niri.
tag_animation_direction=0

# open 200 ms ease-out-expo, close 150 ms ease-out-quad; gli spring di
# niri (spostamenti, resize, cambio workspace) diventano curve brevi.
animation_duration_open=200
animation_duration_close=150
animation_duration_move=250
animation_duration_tag=250
animation_duration_focus=0
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_close=0.5,1.0,0.89,1.0
animation_curve_move=0.25,1.0,0.5,1.0
animation_curve_tag=0.25,1.0,0.5,1.0
animation_curve_focus=0.25,1.0,0.5,1.0
animation_curve_opafadein=0.16,1.0,0.3,1.0
animation_curve_opafadeout=0.5,1.0,0.89,1.0


# ━━━━ CURSORE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Tema e dimensione: theme.conf (gli stessi di home.pointerCursor).
# Sparisce mentre scrivi e dopo 2 secondi fermo, come in niri.
cursor_hide_timeout=2
cursor_hide_on_keypress=1


# ━━━━ VARIE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Niente angoli caldi (erano spenti anche in niri).
enable_hotarea=0
# Le finestre flottanti si agganciano ai bordi.
enable_floating_snap=1
snap_distance=20
# X11 (Steam, giochi vecchi) solo quando serve.
xwayland_persistence=0
