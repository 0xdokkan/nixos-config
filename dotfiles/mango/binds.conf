# ╔══════════════════════════════════════════════════════════════════════╗
# ║  mango — scorciatoie (portate da niri: stessi tasti dove si può)     ║
# ║                                                                      ║
# ║  Formato: bind[flag]=MODIFICATORI,TASTO,AZIONE,ARGOMENTI             ║
# ║    bindl = vale anche a schermo bloccato (volume, luminosità, media) ║
# ║  I tasti si scrivono per nome (keysym); mango li converte nel tasto  ║
# ║  fisico. La punteggiatura che cambia tra it e us va per codice:      ║
# ║  code:61 è il tasto "/" della tastiera us ("-" su quella italiana).  ║
# ║                                                                      ║
# ║  Le righe "#: ..." sopra un bind finiscono nel cheatsheet            ║
# ║  (Mod+Shift+/). "#: TASTI | descrizione" vale per il gruppo che      ║
# ║  segue e mostra TASTI al posto del bind.                             ║
# ║                                                                      ║
# ║  Attenzione: mango divide gli argomenti sulle virgole, quindi nei    ║
# ║  comandi niente virgole (e niente argomento "0" da solo): ciò che    ║
# ║  è complicato sta negli script (dotfiles/mango/scripts, nel PATH).   ║
# ╚══════════════════════════════════════════════════════════════════════╝


# ━━━━ SESSIONE E FINESTRE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Chiudi finestra (Steam va in tray)
bind=SUPER,q,spawn,dontkillsteam.sh
#: Chiudi finestra (Steam va in tray)
bind=ALT,F4,spawn,dontkillsteam.sh
#: Esci da mango
bind=SUPER,Delete,quit
#: Ricarica la config di mango
bind=SUPER+SHIFT,c,reload_config
#: Blocca lo schermo
bind=SUPER,l,spawn,loginctl lock-session
#: Menu di spegnimento
bind=SUPER,BackSpace,spawn,powermenu.sh

#: Flottante sì/no
bind=SUPER,w,togglefloating
#: Flottante sì/no
bind=SUPER,z,togglefloating
#: Flottante + centrata + su tutti i tag
bind=SUPER+SHIFT,f,spawn,windowpin.sh
#: Massimizza (tiene barra e gap)
bind=SUPER,m,togglemaximizescreen
#: Schermo intero
bind=SUPER+SHIFT,m,togglefullscreen
#: Schermo intero
bind=ALT,Return,togglefullscreen


# ━━━━ APP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Terminale (kitty)
bind=SUPER,t,spawn,kitty
#: File manager
bind=SUPER,e,spawn,nautilus --new-window
#: Cerca file (rofi + fd)
bind=SUPER+SHIFT,e,spawn,filesearch.sh
#: Neovim
bind=SUPER,c,spawn,kitty nvim
#: Firefox
bind=SUPER,f,spawn,firefox
#: Processi (htop)
bind=CTRL+SHIFT,Escape,spawn,kitty -e htop
#: Processi (htop)
bind=SUPER+SHIFT,Escape,spawn,kitty -e htop

#: Mod+Space / A / Tab / Shift+A | Avvia app (rofi)
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,a,spawn,rofi -show drun
bind=SUPER,Tab,spawn,rofi -show drun
bind=SUPER+SHIFT,a,spawn,rofi -show drun
#: Cronologia appunti
bind=SUPER,v,spawn,clipboard.sh
#: Cronologia appunti
bind=SUPER+SHIFT,v,spawn,clipboard.sh
#: Cheatsheet di questi tasti
bind=SUPER+SHIFT,code:61,spawn,cheatsheet.sh


# ━━━━ NOTIFICHE E BARRA (swaync, waybar) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Centro di controllo e notifiche
bind=SUPER+SHIFT,p,spawn,swaync-client -t -sw
#: Centro di controllo e notifiche
bind=SUPER,n,spawn,swaync-client -t -sw
#: Nascondi i popup delle notifiche
bind=SUPER+SHIFT,n,spawn,swaync-client --hide-all -sw
#: Non disturbare sì/no
bind=SUPER+CTRL,n,spawn,swaync-client -d -sw
#: Mostra/nascondi la barra
bind=CTRL+ALT,w,spawn,pkill -USR1 waybar


# ━━━━ AUDIO, LUMINOSITÀ, MEDIA (anche a schermo bloccato) ━━━━━━━━━━━━━━━
# Con Alt, come in niri: F11/F12 da soli restano alle app.
#: Muto
bindl=ALT,F10,spawn,swayosd-client --output-volume mute-toggle
#: Volume -
bindl=ALT,F11,spawn,swayosd-client --output-volume lower
#: Volume +
bindl=ALT,F12,spawn,swayosd-client --output-volume raise
bindl=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bindl=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bindl=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bindl=NONE,XF86AudioMicMute,spawn,swayosd-client --input-volume mute-toggle
bindl=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bindl=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# Luce notturna: wl-gammarelay-rs (servizio utente) regola la temperatura.
#: Luce notturna (4000 K)
bind=ALT,F8,spawn,busctl --user set-property rs.wl-gammarelay / rs.wl.gammarelay Temperature q 4000
#: Luce normale (6500 K)
bind=ALT,F9,spawn,busctl --user set-property rs.wl-gammarelay / rs.wl.gammarelay Temperature q 6500


# ━━━━ FOCUS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Scroller: sinistra/destra = finestre affiancate, su/giù = finestre
# impilate nella stessa colonna (Mod+. / Mod+,).
#: Mod+frecce | Sposta il focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
#: Finestra successiva (poi il tag dopo)
bind=ALT,Tab,focus_window_or_workspace,right


# ━━━━ SPOSTARE E RIDIMENSIONARE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Mod+Shift+Ctrl+frecce | Scambia la finestra con la vicina
bind=SUPER+SHIFT+CTRL,Left,exchange_client,left
bind=SUPER+SHIFT+CTRL,Right,exchange_client,right
bind=SUPER+SHIFT+CTRL,Up,exchange_client,up
bind=SUPER+SHIFT+CTRL,Down,exchange_client,down
#: Impila nella colonna a destra / esci
bind=SUPER,period,scroller_stack,right
#: Impila nella colonna a sinistra / esci
bind=SUPER,comma,scroller_stack,left

#: Cicla le larghezze 1/3, 1/2, 2/3, 1
bind=SUPER,r,switch_proportion_preset
#: Mod+Shift+frecce | Ridimensiona
bind=SUPER+SHIFT,Left,resizewin,-50,+0
bind=SUPER+SHIFT,Right,resizewin,+50,+0
bind=SUPER+SHIFT,Up,resizewin,+0,-50
bind=SUPER+SHIFT,Down,resizewin,+0,+50

# Gruppi a schede (era la colonna a schede di niri).
#: Unisci alla finestra a destra (schede)
bind=SUPER,g,groupjoin,right
#: Esci dal gruppo
bind=SUPER+SHIFT,g,groupleave
#: Scheda precedente
bind=SUPER+CTRL,h,groupfocus,prev
#: Scheda successiva
bind=SUPER+CTRL,l,groupfocus,next


# ━━━━ TAG (i workspace) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Ripremere il tag corrente torna al precedente (view_current_to_back).
#: Mod+1..0 | Vai al tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
#: Mod+Shift+1..0 | Sposta la finestra nel tag e seguila
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10
#: Mod+Alt+1..0 | Sposta la finestra nel tag e resta qui
bind=SUPER+ALT,1,tagsilent,1
bind=SUPER+ALT,2,tagsilent,2
bind=SUPER+ALT,3,tagsilent,3
bind=SUPER+ALT,4,tagsilent,4
bind=SUPER+ALT,5,tagsilent,5
bind=SUPER+ALT,6,tagsilent,6
bind=SUPER+ALT,7,tagsilent,7
bind=SUPER+ALT,8,tagsilent,8
bind=SUPER+ALT,9,tagsilent,9
bind=SUPER+ALT,0,tagsilent,10

#: Mod+Ctrl+frecce | Tag precedente / successivo
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER+CTRL,Up,viewtoleft
bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Down,viewtoright
#: Mod+Ctrl+Alt+←/→ | Sposta la finestra nel tag accanto
bind=SUPER+CTRL+ALT,Left,tagtoleft
bind=SUPER+CTRL+ALT,Right,tagtoright

#: Overview di tutte le finestre
bind=SUPER,s,toggleoverview
#: Manda la finestra nello scratchpad
bind=SUPER+ALT,s,minimized
#: Mostra/nascondi lo scratchpad
bind=SUPER+CTRL,s,toggle_scratchpad


# ━━━━ SCREENSHOT E SFONDO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Salvati in ~/Pictures/Screenshots e copiati negli appunti.
#: Screenshot di una zona
bind=SUPER,p,spawn,screenshot.sh region
#: Screenshot di una zona + editor (swappy)
bind=SUPER+CTRL,p,spawn,screenshot.sh edit
#: Screenshot dello schermo
bind=SUPER+ALT,p,spawn,screenshot.sh screen
#: Screenshot dello schermo
bind=NONE,Print,spawn,screenshot.sh screen

#: Sfondo successivo
bind=SUPER+ALT,Right,spawn,wallpaper.sh next
#: Sfondo precedente
bind=SUPER+ALT,Left,spawn,wallpaper.sh prev
#: Scegli lo sfondo
bind=SUPER+SHIFT,w,spawn,wallpaper.sh pick


# ━━━━ VARIE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Cambia layout tastiera (it/us sul portatile)
bind=SUPER,k,spawn,keyboardswitch.sh
#: Modalità gioco (niente gap né animazioni)
bind=SUPER+ALT,g,spawn,gamemode.sh

# Mod+Shift+T e Mod+Shift+R: liberi per ora (erano tema e impostazioni della shell).
# Non portati da niri: Mod+X (altezza originale della finestra), che in
# mango non ha un equivalente.


# ━━━━ MOUSE E TOUCHPAD ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#: Mod+trascina | Sposta (sinistro) / ridimensiona (destro)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
#: Mod+rotella | Tag precedente / successivo
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
#: Mod+Shift+rotella | Sposta la finestra nel tag accanto
axisbind=SUPER+SHIFT,UP,tagtoleft
axisbind=SUPER+SHIFT,DOWN,tagtoright

# Gesti (scattano a fine movimento). Il verso segue lo scroll naturale:
# il contenuto va dove spingi le dita.
#: 3 dita ←/→ | Finestra accanto
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
#: 3 dita ↑/↓ | Tag successivo / precedente
gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft
#: 4 dita ↑/↓ | Overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
